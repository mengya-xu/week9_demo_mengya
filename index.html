<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Farmers Markets in Los Angeles County</title>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.1/"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <arcgis-map basemap="topo-vector" center="-118.285, 34.02" zoom="11">
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-layer-list slot="top-right"></arcgis-layer-list>
      <arcgis-legend slot="bottom-left"></arcgis-legend>
    </arcgis-map>

    <script type="module">
      const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer.js");

      const viewElement = document.querySelector("arcgis-map");
      await viewElement.viewOnReady(); // Wait for the properties to be ready.

      const renderer = {
        type: "simple", // autocasts as new SimpleRenderer()
        symbol: { type: "simple-marker", size: 9, color: "#ff5C00", outline: { color: "#ffffff", width: 1 } },
      };

      const markets = new FeatureLayer({
        url: "https://public.gis.lacounty.gov/public/rest/services/LACounty_Dynamic/LMS_Data_Public/MapServer/40",
        title: "Certificated farmers markets",
        renderer,  
        popupTemplate: {
          title: "{name}", // Specify the popup title.
          content: "<b>Open:</b> {hours} <br><b>Where:</b> {addrln1}, {city}",
        },
      });

      viewElement.map.add(markets); // Use the map property to add the layer.
    </script>
  </body>
</html>
